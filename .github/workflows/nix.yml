name: Nix

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-flake:
    name: Build flake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Temporary lock-generation step; remove once the generated lock is committed.
      - name: Generate updated nixpkgs lock
        run: nix flake lock --override-input nixpkgs github:NixOS/nixpkgs/5adc50831c259f87faeb09ddf930d43597197473

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: updated-flake-lock
          path: flake.lock

      - name: Build flake
        run: nix build . --print-build-logs
